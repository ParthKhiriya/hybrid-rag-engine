[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-engine"
version = "0.1.0"
description = "Hybrid retrieval engine combining vector search, knowledge-graph traversal, and grounded answer generation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Parth Khiriya"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "langgraph>=1.2.9,<2.0",
  "qdrant-client>=1.15,<2.0",
  "neo4j>=6.0,<7.0",
  "openai>=1.60,<3.0",
  "anthropic>=0.45,<1.0",
  "prometheus-client>=0.21,<1.0",
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
  "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0"
]
eval = [
  "ragas>=0.2,<1.0",
  "deepeval>=2.0,<4.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
